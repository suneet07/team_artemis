name: change_stats
description: Exact per-class area before/after/delta, scene change ratio, per-class change ratio, and largest/smallest change by class, computed arithmetically from a semantic change map (D4).
version: 2
required_modalities: [optical, sar]
modality_mode: any
confidence_source: deterministic_arithmetic
expected_latency_ms: 60
permitted_parameters: {}
outputs:
  change_ratio:
    type: float
  per_class:
    type: stats
