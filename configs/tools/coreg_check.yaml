name: coreg_check
description: P3 co-registration exposed as a tool so its execution appears in the trace. Phase cross-correlation within a modality, mutual information across optical and SAR. Verify-only on pre-co-registered pairs.
version: 1
required_modalities: [optical, sar]
modality_mode: any
confidence_source: threshold_statistics
expected_latency_ms: 1500
permitted_parameters:
  verify_only:
    type: bool
    default: true
outputs:
  rmse_px:
    type: float
  checks_passed:
    type: stats
