name: change_map
description: Siamese change detection on a TorchGeo MIT-licensed backbone, emitting a binary or semantic change mask as a full-scene-resolution geo-referenced GeoTIFF in the source CRS.
version: 1
required_modalities: [optical, sar]
modality_mode: any
confidence_source: learned_logprob
expected_latency_ms: 3000
permitted_parameters:
  threshold:
    type: float
    range: [0.0, 1.0]
    default: 0.5
  semantic:
    type: bool
    default: false
outputs:
  mask_uri:
    type: geotiff
    crs: source
    resolution: full_scene
