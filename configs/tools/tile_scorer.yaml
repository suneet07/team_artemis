name: tile_scorer
description: P4 tiling and query relevance exposed as a tool. Partitions a scene into overlapping geo-indexed tiles plus a global overview and selects the top-k worth processing.
version: 1
required_modalities: [optical, sar]
modality_mode: any
confidence_source: heuristic
expected_latency_ms: 900
permitted_parameters:
  top_k:
    type: int
    range: [1, 32]
    optional: true
outputs:
  selected:
    type: stats
