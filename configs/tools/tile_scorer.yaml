name: tile_scorer
description: Evaluates and ranks candidate image tiles by cloud-free score, edge density, and informational entropy.
version: 1
required_modalities: [-]
confidence_source: heuristic
expected_latency_ms: 100
permitted_parameters:
  top_k:
    type: int
    range: [1, 20]
    default: 4
    optional: true
outputs:
  scores:
    type: stats
