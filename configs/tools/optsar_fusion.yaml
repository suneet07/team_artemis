name: optsar_fusion
description: Cross-modal optical plus SAR question answering with the optsar_fusion LoRA adapter. An upgrade layered over the deterministic D1 fusion floor, never a dependency of it.
version: 1
required_modalities: [optical, sar]
confidence_source: learned_logprob
expected_latency_ms: 5500
permitted_parameters:
  adapter:
    type: string
    optional: true
  max_new_tokens:
    type: int
    range: [1, 512]
    default: 128
outputs:
  answer:
    type: text
