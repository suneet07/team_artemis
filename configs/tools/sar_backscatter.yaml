name: sar_backscatter
description: Segments sigma-nought dB backscatter into a water or built-up mask, using the same Otsu-with-bimodality-gate and fixed physical fallback as spectral_index, with thresholds keyed by (sar_band, polarisation).
version: 2
required_modalities: [sar]
confidence_source: threshold_statistics
expected_latency_ms: 250
permitted_parameters:
  target:
    type: enum
    values: [water, built-up, builtup]
    default: water
  pol:
    type: enum
    values: [VV, VH, HH, HV]
    optional: true
  threshold_method:
    type: enum
    values: [otsu, fixed]
    default: otsu
  threshold_db:
    type: float
    range: [-50.0, 30.0]
    optional: true
outputs:
  # C18: masks are graded outputs. Full scene resolution, source CRS, GeoTIFF.
  mask_uri:
    type: geotiff
    crs: source
    resolution: full_scene
  area_km2:
    type: float
