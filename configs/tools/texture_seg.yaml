name: texture_seg
description: Computes local texture statistics and edge density.
version: 1
required_modalities: [optical]
confidence_source: heuristic
expected_latency_ms: 300
permitted_parameters:
  window_size:
    type: int
    range: [3, 31]
    default: 5
outputs:
  response_map:
    type: geotiff
    crs: source
    resolution: full_scene
