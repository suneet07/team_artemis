name: spectral_index
description: Computes a normalised spectral index over optical imagery and thresholds it into a full-scene mask.
version: 1
required_modalities: [optical]
confidence_source: threshold_statistics
expected_latency_ms: 200
permitted_parameters:
  index:
    type: enum
    values: [NDVI, NDWI, MNDWI, NDBI]
    requires_bands:
      NDVI: [nir, red]
      NDWI: [green, nir]
      MNDWI: [green, swir]
      NDBI: [swir, nir]
  threshold_method:
    type: enum
    values: [otsu, fixed]
    default: otsu
  threshold_value:
    type: float
    range: [-1.0, 1.0]
    optional: true
outputs:
  mask_uri:
    type: geotiff
    crs: source
    resolution: full_scene
  area_km2:
    type: float
