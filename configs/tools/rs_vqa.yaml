name: rs_vqa
description: Single-image visual question answering and captioning on the base VLM with the rs_vqa LoRA adapter. Text answer plus answer log-probability.
version: 1
required_modalities: [optical, sar]
modality_mode: any
confidence_source: learned_logprob
expected_latency_ms: 4000
permitted_parameters:
  adapter:
    type: string
    optional: true
  max_new_tokens:
    type: int
    range: [1, 512]
    default: 128
outputs:
  answer:
    type: text
