# SatQuery preprocessing contract — FROZEN in Phase 0 (master plan Part 8 item 4).
#
# Master plan section 4.2: "this chain must be byte-identical at training and
# inference. If BigEarthNet's S1 was processed one way and RISAT another, you
# have manufactured a domain gap by hand."
#
# The same argument applies to the optical side. Every constant that shapes what
# the model sees lives here, not in code. Changing a value here is a domain
# shift: bump `version`, and re-derive any number that was tuned against the old
# one. Unknown or missing keys are a hard load error, not a warning.

version: 2

ingest:
  # Decimated read used for metadata, modality and nodata estimation. Never a
  # full src.read() of a Cartosat scene (section 4.1.1).
  overview_max_side: 512
  # Above this the scene is flagged; masked statistics still proceed (4.5.3).
  nodata_warn_fraction: 0.5

radiometry:
  # Robust stretch for model input (section 4.1.3). Bounds are per-scene and
  # must be recorded in provenance by the caller — reproducibility depends on it.
  low_percentile: 2.0
  high_percentile: 98.0

modality:
  # Heuristic cascade of section 4.1.2, in order: metadata tags (authoritative),
  # then the sigma-nought dB test, then the speckle signature, then band count.
  #
  # The speckle signature is computed per band and reduced by median, never
  # pooled across bands: pooling channels with different radiometric ranges
  # inflates the coefficient of variation and makes a 13-band multispectral
  # stack look heavy-tailed.
  #
  # Reference: single-look SAR amplitude is exponentially distributed, giving
  # cv = 1.0 and skew = 2.0. Multilooking and speckle filtering both pull those
  # down, which is what the ambiguous band below is for.
  speckle_cv_min: 0.9
  speckle_skew_min: 1.0
  # Between the ambiguous floor and the SAR thresholds the answer is "unknown",
  # which routes to the ask-the-user branch of 4.1.2 rather than a guess.
  ambiguous_cv_min: 0.6
  ambiguous_skew_min: 0.6
  # Terrain-corrected sigma-nought arrives already in dB and is therefore mostly
  # negative — the speckle test cannot see it, because that test needs positive
  # amplitudes. The ISRO eval pairs are expected to arrive in this state (4.2).
  db_min_negative_fraction: 0.3
  db_plausible_range: [-60.0, 30.0]
  # The range test is evaluated on these percentiles, not on min/max. Real
  # sigma-nought carries a thin tail of near-zero backscatter that reaches -70 dB
  # or lower, and a hard min/max gate would reject a legitimate SAR scene on the
  # strength of a handful of pixels.
  db_sample_percentiles: [1.0, 99.0]
  # Guards against reading a normalised index raster (NDVI is float in [-1, 1],
  # roughly 40% negative) as dB SAR. Calm water sits at -25 to -20 dB, so real
  # sigma-nought always reaches well below this.
  db_must_reach_below: -5.0

bands:
  # Applied only when band descriptions are absent or too sparse to be usable,
  # and only to optical input. Cartosat-2S MX is B,G,R,NIR (section 4.1.4).
  # A description that contradicts the assumed order disables the assumption
  # rather than overriding it — a wrong band map silently corrupts every index.
  assumed_orders:
    3: [blue, green, red]
    4: [blue, green, red, nir]

  # Sentinel-1 GRD ships no band descriptions at all, so a dual-pol scene
  # arrives with an empty inventory and every radar tool refuses it: the SAR
  # land-cover classifier -- the component holding the 74.95% number -- failed
  # with "needs band 'VH'; this scene does not provide it" on every reBEN patch.
  #
  # VH first, and that ordering is measured rather than assumed. Running BIFOLD
  # both ways over 2,000 rows (logs/bifold_probe_sar.json):
  #
  #     s1 = vh_vv   accuracy 0.817
  #     s1 = vv_vh   accuracy 0.499    <- chance
  #
  # The intuitive VV,VH reading is the one that is wrong, which is exactly why
  # this is pinned to the probe and not to intuition.
  assumed_sar_orders:
    2: [vh, vv]

# ---------------------------------------------------------------------------
# Consumed by P2 (section 4.2) and P4 (section 4.4). Frozen here now because
# item 4 gates the phase; the modules themselves are Phase 1 work.
# ---------------------------------------------------------------------------

sar:
  chain:
    - apply_orbit_file
    - calibrate_sigma0
    - multilook
    - speckle_filter_refined_lee
    - terrain_correction
    - db_conversion
    - percentile_stretch
    - model_input_stack
  # Re-correcting already-corrected data degrades it (4.2 step 5).
  skip_terrain_correction_if_pregeoreferenced: true
  # Fraction of dual-pol training samples converted to the single-pol stack so
  # the model has genuinely seen 1-channel SAR before the hidden set shows it
  # one (4.2). The single-pol stack is a first-class citizen, not an error path.
  pol_dropout_rate: 0.25
  # Section 4.2: these WARN, they never block. A hard assert tuned on C-band
  # would refuse a legitimate X-band scene from the graded hidden set.
  # C-band VV is the calibrated reference table from the plan. X and L are
  # deliberately null — nothing is tuned yet, and inventing thresholds here
  # would freeze a guess. Null means "inherit C-band and warn"; X gets tuned on
  # SpaceNet 6 Capella data in Phase 2 (C31), L when an L-band source lands.
  sanity_ranges_db:
    C:
      calm_water: [-25.0, -20.0]
      smooth_bare_soil: [-15.0, -12.0]
      rough_soil_crops: [-12.0, -8.0]
      forest: [-8.0, -6.0]
      urban: [-5.0, 5.0]
    X: null
    L: null
  # Fixed physical fallbacks for sar_backscatter (section 4.6.5), keyed by band
  # then polarisation. Used only when the bimodality gate rejects Otsu, exactly
  # like the spectral index table. Water is specular (low backscatter); built-up
  # is double-bounce (high). A null band inherits the C-band table and raises a
  # trace warning, so an X-band RISAT-2B scene can never be silently scored
  # against C-band physics.
  fixed_thresholds_db:
    C:
      VV: {water_max: -18.0, builtup_min: -3.0}
      VH: {water_max: -24.0, builtup_min: -12.0}
      HH: {water_max: -18.0, builtup_min: -3.0}
      HV: {water_max: -24.0, builtup_min: -12.0}
    X: null
    L: null

tiling:
  # Overlap tiles to avoid boundary artifacts (section 4.4 step 2).
  tile_overlap_fraction: 0.10
  # FROZEN (v2). 262144 px = exactly a 512x512 view, which is the benchmark chip
  # size and the tile size every source is cut to upstream. Derived from the
  # measured A100-80GB cost surface, not guessed.
  #
  # This is a CAP, not a target. Qwen3-VL never upsamples, so for a source at or
  # below this value the cap is inert. For a source ABOVE it the processor
  # silently downsamples, which corrupts ground sample distance after curation
  # has already run. Every source must therefore be tiled to <= this value
  # UPSTREAM; a raster arriving above the cap is a pipeline bug, not a resize.
  #
  # STILL OUTSTANDING: this value has been checked against the compute budget but
  # NOT against the 5 min/scene prep SLA on the named demo machine. That check
  # can lower it; it cannot raise it.
  max_pixels: 262144
  # Native tile side before the max_pixels cap applies (section 4.4). 512 px is
  # both the benchmark chip size and exactly max_pixels, so a tile passes the
  # cap check untouched.
  tile_side_px: 512
  # Hard caps so scene size cannot blow the query SLA (section 4.4 step 5).
  max_tiles: 256
  top_k_tiles: 4

# ---------------------------------------------------------------------------
# Consumed by P6 (sections 4.6.2, 4.6.5, 4.6.8, 4.6.9), P3 (4.3) and P7 (4.7).
# Every threshold that shapes a graded output lives here, never in Python.
# ---------------------------------------------------------------------------

indices:
  # Otsu assumes a bimodal histogram. On a tile that is 95% land with one pond it
  # returns a confident, meaningless threshold, and that error flows silently
  # into D1, D2 and D4. Section 4.6.2 gates it on the between-class variance
  # ratio and on both classes being non-trivial.
  otsu:
    min_between_class_variance_ratio: 0.5
    min_class_fraction: 0.05
  # Physical fallbacks used when the gate rejects Otsu (4.6.2 step 3). Initial
  # values from the plan; provisional, tuned on holdout. `above_is_positive`
  # records which side of the cut is the class of interest, so no caller has to
  # remember that NDWI water is high while a future index may not be.
  fixed_thresholds:
    NDVI: {value: 0.3, above_is_positive: true, target: vegetation}
    NDWI: {value: 0.2, above_is_positive: true, target: water}
    MNDWI: {value: 0.0, above_is_positive: true, target: water}
    NDBI: {value: 0.0, above_is_positive: true, target: builtup}

texture:
  # texture_seg (4.6.8) and object_box_fallback (4.6.9). Windows are in pixels
  # and must be odd so the response map stays aligned with the source grid.
  window_px: 9
  glcm_levels: 16
  # Morphological opening radius, applied before connected components to
  # suppress speckle (4.6.9 step 2).
  opening_radius_px: 1
  # A component must clear this fraction of valid pixels to be proposed.
  min_component_fraction: 0.0005
  max_proposals: 8
  # Fallback response cut when the bimodality gate rejects Otsu on the texture
  # map. Texture response is normalised to [0, 1] by construction.
  fixed_response_threshold: 0.35

coreg:
  # Section 4.3. Sub-pixel to ~1 px is good; past refuse_above_rmse_px a change
  # answer would be reporting building outlines as change, so we refuse.
  max_rmse_px: 1.0
  refuse_above_rmse_px: 8.0
  # Optical and SAR share no visual features, so intensity correlation fails and
  # mutual information is used instead (4.3 step 3).
  mutual_information_bins: 32
  upsample_factor: 10

fusion:
  # Section 4.7.1/4.7.2. At or above iou_consistent the two modalities agree;
  # below iou_conflict they actively disagree and the rule table must name a
  # physical cause or the system reports the agreed extent only.
  iou_consistent: 0.6
  iou_conflict: 0.3
  # Applied when the modalities disagree, and when a threshold fell off Otsu
  # onto the physical fallback (4.6.2 step 4).
  disagreement_penalty: 0.6
  threshold_fallback_penalty: 0.85
  # A deterministic proposer never outranks learned grounding (4.6.9).
  deterministic_fallback_ceiling: 0.35
